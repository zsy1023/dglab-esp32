; 平台 / 框架版本已钉死，保证任何人 clone 下来编译结果一致：
;   platform-espressif32 @ 6.4.0
;   framework-arduinoespressif32 @ 3.20011（Arduino core 2.0.11 / ESP-IDF 4.4）
;   toolchain-xtensa-esp32
; 首次编译时 PlatformIO 会自动下载上述包（需要联网；国内网络建议先设好代理）。
;
; 为什么用 Arduino core 自带 BLE（Bluedroid）而不是 NimBLE-Arduino：
;   1) 零外部依赖，板子到手就能编译（不用额外拉库）；
;   2) 复刻真机 GATT 全表只需要"自定义 16 位 UUID 的服务/特征"，Bluedroid 完全够用；
;   3) 0x1800（GAP）/ 0x1801（GATT）由协议栈内建，正是真机里有的那两个。

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino

; 串口就是"与 PC 侧的链路"（同时也是烧写口）：115200 = 契约里的默认波特率
monitor_speed = 115200
upload_speed = 921600

; ★ 协议与日志共用 UART0：所有日志统一 '#' 前缀 + 换行，PC 侧按行丢弃。
;   这里把 Arduino 自身的 BLE 调试输出关到最低，避免它往同一条串口里灌无前缀文本。
build_flags =
    -DCORE_DEBUG_LEVEL=0

build_unflags =
    -DCORE_DEBUG_LEVEL=5
